/* Layout: one headline resting on the horizon line (60% down), a three-icon dock top right, nothing else.
   One bright look by design: this page does not switch to a dark theme. */
:root{color-scheme:light;
  --bg:#7CCBF6;--ink:#12314F;--glass:rgba(255,255,255,.62);--glass-line:rgba(255,255,255,.85);
  --shadow:rgba(18,49,79,.16);--hover:rgba(18,49,79,.1);
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
  padding-top:calc(env(safe-area-inset-top,0px) + clamp(14px,3vh,28px));
  padding-bottom:40vh;padding-bottom:40dvh;
  padding-left:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  padding-right:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px))}
.dock{align-self:flex-end;pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 10px 30px var(--shadow);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;text-decoration:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bars{display:flex;align-items:center;gap:3px;height:16px}
.bars i{width:2px;height:100%;border-radius:2px;background:currentColor;transform:scaleY(.32)}
@keyframes bar{0%,100%{transform:scaleY(.32)}50%{transform:scaleY(1)}}
.on .bars i{animation:bar 1.1s ease-in-out infinite}
.on .bars i:nth-child(2){animation-delay:.22s}

@media (prefers-reduced-motion:reduce){.on .bars i{animation:none;transform:scaleY(.7)}}

<canvas id="scene" aria-hidden="true"></canvas>

<div class="hud">

  <p class="sr-only">Tevin Medley, Organizational Transformation Strategist and Community Network Builder.</p>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const K = calm ? 0.35 : 1; // ambient motion scale
const canvas = $('scene'), ctx = canvas.getContext('2d');
const headline = $('headline'), words = Array.from(headline.querySelectorAll('span'));
let W = 1, H = 1, dpr = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const mix = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const rgb = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;

/* ---------- 1. Sound: synthesised in the browser, no audio files, off until asked for ---------- */
class Sound {
  constructor() { this.ctx = null; this.on = false; this.lastChime = 0; this.lastSwoosh = 0; }
  toggle() {
    this.on = !this.on;
    if (this.on) {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    const b = $('audio-btn');
    b.classList.toggle('on', this.on);
    b.setAttribute('aria-pressed', String(this.on));
    b.setAttribute('aria-label', this.on ? 'Turn sound off' : 'Turn sound on');
    if (this.on) this.chime(523.25, 0.05);
  }
  ready() { return this.on && this.ctx; }
  // Marimba-like chime on a bright pentatonic scale
  chime(freq = null, vol = 0.045) {
    if (!this.ready()) return;
    const c = this.ctx, now = c.currentTime;
    if (!freq && now - this.lastChime < 0.24) return;
    this.lastChime = now;
    const scale = [392.0, 440.0, 493.88, 587.33, 659.25, 739.99, 880.0];
    const f = freq || scale[Math.floor(Math.random() * scale.length)];
    const osc = c.createOscillator(), over = c.createOscillator(), g = c.createGain(), og = c.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(f, now);
    over.type = 'triangle'; over.frequency.setValueAtTime(f * 2, now);
    og.gain.setValueAtTime(0.18, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
    osc.connect(g); over.connect(og); og.connect(g); g.connect(c.destination);
    osc.start(now); over.start(now); osc.stop(now + 1.3); over.stop(now + 1.3);
  }
  // Filtered-noise wash for a bow wave or a splash
  swoosh(speed = 1) {
    if (!this.ready()) return;
    const c = this.ctx, now = c.currentTime;
    if (now - this.lastSwoosh < 0.16) return;
    this.lastSwoosh = now;
    const dur = 0.38 + Math.min(1.2, speed * 0.03);
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / n) * Math.PI);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 1.6;
    f.frequency.setValueAtTime(260, now);
    f.frequency.exponentialRampToValueAtTime(Math.min(1800, 500 + speed * 40), now + dur * 0.45);
    f.frequency.exponentialRampToValueAtTime(220, now + dur);
    const g = c.createGain(), peak = Math.min(0.06, 0.014 + speed * 0.002);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(peak, now + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(now);
  }
}
const sound = new Sound();
$('audio-btn').addEventListener('click', () => sound.toggle());

/* ---------- 2. Scene state ---------- */
const LAYERS = 5; // wave bands, far to near
const SAILS = ['#FF6B5A', '#FFC93C', '#FFFFFF', '#FF8FB1', '#19C2B4'];
const SKY = { noon: [[36, 148, 234], [124, 203, 246], [216, 243, 252]], gold: [[98, 172, 232], [255, 200, 164], [255, 233, 184]] };
const SEA = { noon: [[24, 158, 206], [18, 205, 198]], gold: [[62, 150, 198], [58, 198, 190]] };
const sun = { x: 0, y: 0, tx: 0, ty: 0 };
let hz = 0, sunR = 40, started = false, steered = false, launched = 0;
let boats = [], clouds = [], birds = [], dolphins = [], splashes = [];
let nextLeap = performance.now() + 2600;

const small = () => W < 600;
const layerBase = (k) => hz + Math.pow((k + 0.3) / LAYERS, 1.5) * (H - hz);
const layerScale = (k) => lerp(0.5, 1.35, k / (LAYERS - 1)) * (small() ? 0.8 : 1);
function waveY(k, x, t) {
  const u = k / (LAYERS - 1), A = 2.5 + u * 13, f = lerp(0.03, 0.008, u);
  return layerBase(k) + A * Math.sin(x * f + t * (0.9 + k * 0.23) + k * 1.7) + A * 0.45 * Math.sin(x * f * 2.3 - t * (1.3 + k * 0.1) + k);
}

/* ---------- 3. The headline rests on the horizon and is mirrored in the water ---------- */
const mirror = document.createElement('canvas'), mctx = mirror.getContext('2d');
let mirrorH = 0;
const fontOf = (cs) => `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
function placeHeadline() {
  headline.style.transform = '';
  const cs0 = getComputedStyle(words[0]);
  ctx.save(); ctx.font = fontOf(cs0);
  const ascent = ctx.measureText('Hx').fontBoundingBoxAscent || parseFloat(cs0.fontSize) * 0.8;
  ctx.restore();
  const rects = words.map((w) => w.getBoundingClientRect());
  const lastTop = Math.max(...rects.map((r) => r.top));
  const shift = hz - (lastTop + ascent) + 1; // put the last line's baseline on the waterline
  headline.style.transform = `translateY(${shift.toFixed(1)}px)`;
  const top = Math.min(...rects.map((r) => r.top)) + shift - 2;
  mirrorH = Math.max(1, hz - top);
  mirror.width = Math.round(W * dpr); mirror.height = Math.round(mirrorH * dpr);
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.clearRect(0, 0, W, mirrorH);
  mctx.fillStyle = '#0B3F60'; mctx.textBaseline = 'alphabetic';
  words.forEach((w, i) => {
    const cs = getComputedStyle(w);
    mctx.font = fontOf(cs);
    if ('letterSpacing' in mctx) mctx.letterSpacing = cs.letterSpacing;
    mctx.fillText(w.textContent, rects[i].left, rects[i].top + shift + ascent - top);
  });
}
function drawMirror(t) {
  const step = 3, squash = 0.82;
  for (let d = 0; d + step <= mirrorH; d += step) { // d = height above the waterline
    const dx = Math.sin(t * 1.8 + d * 0.11) * (1.2 + d * 0.045);
    ctx.globalAlpha = 0.34 * (1 - (d / mirrorH) * 0.7);
    ctx.drawImage(mirror, 0, (mirrorH - d - step) * dpr, mirror.width, step * dpr, dx, hz + 3 + d * squash, W, step * squash + 0.7);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 4. Setup and input ---------- */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hz = H * 0.6; sunR = Math.min(W, H) * 0.075;
  if (!started) {
    started = true;
    // The sun opens where it sits in the visitor's own day: low and golden early or late, high at noon
    const now = new Date(), day = clamp((now.getHours() + now.getMinutes() / 60 - 6) / 12, 0, 1);
    sun.x = sun.tx = W * lerp(0.14, 0.86, day);
    sun.y = sun.ty = clamp(hz - Math.sin(Math.PI * day) * (hz - H * 0.1), H * 0.08, hz + sunR * 0.2);
    boats = [
      { x: W * 0.2, k: 1, dir: 1, v: 0.16, c: SAILS[2] },
      { x: W * 0.52, k: 2, dir: -1, v: 0.24, c: SAILS[0] },
      { x: W * 0.8, k: 3, dir: 1, v: 0.34, c: SAILS[1] }
    ];
    clouds = Array.from({ length: 6 }, (_, i) => ({ x: rand(0, W), y: H * (0.08 + 0.065 * i) * rand(0.85, 1.1), s: rand(0.7, 1.5), v: rand(0.06, 0.2) }));
  } else {
    sun.tx = clamp(sun.tx, sunR, W - sunR); sun.ty = clamp(sun.ty, H * 0.08, hz + sunR * 0.2);
  }
  placeHeadline();
}
window.addEventListener('resize', resize);

function steer(x, y) {
  canvas.style.cursor = y > hz + 6 ? 'pointer' : 'grab';
  if (y < hz + sunR * 0.5) { sun.tx = clamp(x, sunR, W - sunR); sun.ty = clamp(y, H * 0.08, hz + sunR * 0.2); steered = true; }
}
function launchBoat(x, y) {
  const k = clamp(Math.round(Math.pow((y - hz) / (H - hz), 1 / 1.5) * LAYERS - 0.3), 0, LAYERS - 1);
  boats.push({ x, k, dir: Math.random() < 0.5 ? -1 : 1, v: rand(0.15, 0.45), c: SAILS[boats.length % SAILS.length], born: performance.now() });
  if (boats.length > 16) boats.splice(3, 1);
  sound.chime(null, 0.05); sound.swoosh(6);
  if (++launched === 6) { // a full fleet brings the gulls in
    birds = Array.from({ length: 7 }, (_, i) => ({ x: -40 - i * 46 - rand(0, 20), y: H * 0.16 + (i % 3) * 22 + rand(-8, 8), ph: rand(0, 6.28) }));
    [523.25, 659.25, 783.99].forEach((f, i) => setTimeout(() => sound.chime(f, 0.045), i * 110));
  }
}
// A cursor that is merely resting on the page at load should not move the sun
let first = null, woke = false;
window.addEventListener('pointermove', (e) => {
  if (!first) { first = [e.clientX, e.clientY]; return; }
  if (!woke) { if (Math.hypot(e.clientX - first[0], e.clientY - first[1]) < 6) return; woke = true; }
  steer(e.clientX, e.clientY);
}, { passive: true });
canvas.addEventListener('pointerdown', (e) => {
  woke = true; first = first || [e.clientX, e.clientY];
  steer(e.clientX, e.clientY);
  if (e.clientY > hz + 6) launchBoat(e.clientX, e.clientY);
});

/* ---------- 5. Things that live in the scene ---------- */
function drawBoat(b, t, now) {
  const s = layerScale(b.k);
  const y = waveY(b.k, b.x, t), slope = (waveY(b.k, b.x + 8, t) - waveY(b.k, b.x - 8, t)) / 16;
  const pop = b.born ? Math.min(1, (now - b.born) / 350) : 1;
  ctx.save();
  ctx.translate(b.x, y + 3 * s); ctx.rotate(Math.atan(slope) * 0.8);
  ctx.scale(s * b.dir * pop, s * pop);
  ctx.fillStyle = '#12314F'; ctx.fillRect(-1, -48, 2, 42);
  ctx.beginPath(); ctx.moveTo(3, -47); ctx.lineTo(3, -12); ctx.lineTo(22, -12); ctx.closePath(); ctx.fillStyle = b.c; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3, -41); ctx.lineTo(-3, -12); ctx.lineTo(-16, -12); ctx.closePath(); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-21, -8); ctx.lineTo(22, -8); ctx.lineTo(14, 3); ctx.lineTo(-15, 3); ctx.closePath(); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.fillStyle = '#12314F'; ctx.fillRect(-20, -8, 41, 2.4);
  ctx.restore();
}

// Dolphins leap in pairs from behind a wave, following a simple arc
function leapPod() {
  const k = 1 + Math.floor(Math.random() * 3), s = layerScale(k), dir = Math.random() < 0.5 ? -1 : 1;
  const span = 170 * s + 40, x0 = rand(W * 0.15, W * 0.85) - dir * span / 2;
  for (const [back, delay] of [[0, 0], [52 * s, 280]]) {
    dolphins.push({ x0: x0 - dir * back, dir, k, s, span, h: 95 * s + 16, t0: performance.now() + delay, dur: 1500 / K, wet: false });
  }
}
function drawDolphin(d, t, now) {
  const u = (now - d.t0) / d.dur;
  if (u < 0) return true;
  if (!d.wet) { d.wet = true; splashes.push({ x: d.x0, k: d.k, s: d.s, t0: now }); sound.swoosh(10); }
  if (u >= 1) { splashes.push({ x: d.x0 + d.dir * d.span, k: d.k, s: d.s, t0: now }); return false; }
  const x = d.x0 + d.dir * d.span * u, y = waveY(d.k, x, t) + 12 * d.s - 4 * d.h * u * (1 - u);
  ctx.save();
  // Hide whatever is still below this wave's surface
  ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(W + 10, -10);
  for (let px = W + 10; px >= -10; px -= 12) ctx.lineTo(px, waveY(d.k, px, t));
  ctx.closePath(); ctx.clip();
  ctx.translate(x, y); ctx.scale(d.dir * d.s, d.s);
  ctx.rotate(Math.atan2(-4 * d.h * (1 - 2 * u), d.span));
  ctx.fillStyle = '#2B6C9B';
  ctx.beginPath(); // body, nose to tail and back along the belly
  ctx.moveTo(52, 3); ctx.quadraticCurveTo(44, -1, 38, -6);
  ctx.bezierCurveTo(26, -16, 4, -17, -18, -9); ctx.bezierCurveTo(-30, -5, -38, -2, -45, -3);
  ctx.quadraticCurveTo(-52, -6, -60, -14); ctx.quadraticCurveTo(-54, -3, -53, 1);
  ctx.quadraticCurveTo(-55, 6, -62, 12); ctx.quadraticCurveTo(-52, 7, -44, 3);
  ctx.bezierCurveTo(-30, 6, -16, 10, 4, 11); ctx.bezierCurveTo(22, 12, 36, 9, 42, 6);
  ctx.quadraticCurveTo(48, 6, 52, 3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6, -15); ctx.quadraticCurveTo(0, -27, -12, -29); ctx.quadraticCurveTo(-7, -21, -8, -13); ctx.closePath(); ctx.fill(); // dorsal fin
  ctx.beginPath(); ctx.moveTo(20, 9); ctx.quadraticCurveTo(15, 19, 4, 23); ctx.quadraticCurveTo(11, 15, 10, 10); ctx.closePath(); ctx.fill(); // flipper
  ctx.fillStyle = '#CDE8F4'; // pale belly
  ctx.beginPath(); ctx.moveTo(44, 5.5); ctx.bezierCurveTo(34, 10, 18, 11.5, 2, 10.5); ctx.bezierCurveTo(-12, 9.5, -26, 6.5, -38, 3);
  ctx.bezierCurveTo(-22, 4, 14, 6, 44, 5.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#12314F'; ctx.beginPath(); ctx.arc(37, -1.5, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  return true;
}
function drawSplash(sp, t, now) {
  const a = (now - sp.t0) / 750;
  if (a >= 1) return false;
  const y = waveY(sp.k, sp.x, t), r = (12 + 44 * a) * sp.s;
  ctx.strokeStyle = `rgba(255,255,255,${(1 - a).toFixed(3)})`; ctx.lineWidth = 2 * sp.s + 0.5;
  ctx.beginPath(); ctx.ellipse(sp.x, y + 3, r, r * 0.26, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = `rgba(255,255,255,${(1 - a).toFixed(3)})`;
  for (let j = -2; j <= 2; j++) {
    ctx.beginPath();
    ctx.arc(sp.x + j * 9 * sp.s * (1 + a), y - 34 * sp.s * Math.sin(Math.PI * a) * (1 - Math.abs(j) * 0.22), 2.2 * sp.s, 0, Math.PI * 2);
    ctx.fill();
  }
  return true;
}

function drawPalm(t) {
  const L = Math.min(W, H) * (small() ? 0.44 : 0.6), ox = W + 14, oy = H * (small() ? 0.3 : 0.02);
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const a = Math.PI * (0.6 + i * 0.082) + Math.sin(t * 0.7 + i * 1.3) * 0.03;
    const dx = Math.cos(a), dy = Math.sin(a);
    const c = [ox + dx * L * 0.5, oy + dy * L * 0.5 - L * 0.07], e = [ox + dx * L, oy + dy * L + L * 0.15];
    ctx.strokeStyle = i % 2 ? '#0F8A5F' : '#27B479';
    ctx.lineWidth = Math.max(2, L * 0.0085);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]); ctx.stroke();
    ctx.lineWidth = Math.max(1.5, L * 0.0067);
    ctx.beginPath();
    for (let j = 2; j <= 26; j++) {
      const u = j / 27, v = 1 - u;
      const px = v * v * ox + 2 * v * u * c[0] + u * u * e[0], py = v * v * oy + 2 * v * u * c[1] + u * u * e[1];
      let tx = 2 * v * (c[0] - ox) + 2 * u * (e[0] - c[0]), ty = 2 * v * (c[1] - oy) + 2 * u * (e[1] - c[1]);
      const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
      const len = L * 0.17 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.04)), 0.7) + 4;
      for (const side of [-1, 1]) {
        const lx = -ty * side * 0.8 + tx * 0.55, ly = tx * side * 0.8 + ty * 0.55 + 0.35, ll = Math.hypot(lx, ly);
        ctx.moveTo(px, py); ctx.lineTo(px + lx / ll * len, py + ly / ll * len);
      }
    }
    ctx.stroke();
  }
}

/* ---------- 6. One frame ---------- */
function frame(time) {
  requestAnimationFrame(frame);
  const t = time * 0.001 * K, now = performance.now();
  sun.x += (sun.tx - sun.x) * 0.07; sun.y += (sun.ty - sun.y) * 0.07;
  const e = clamp((hz - sun.y) / (hz - H * 0.08), 0, 1);
  const w = e * e * (3 - 2 * e); // 0 = golden hour, 1 = midday

  const sky = ctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, rgb(mix(SKY.gold[0], SKY.noon[0], w)));
  sky.addColorStop(0.6, rgb(mix(SKY.gold[1], SKY.noon[1], w)));
  sky.addColorStop(1, rgb(mix(SKY.gold[2], SKY.noon[2], w)));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hz + 2);

  const glow = ctx.createRadialGradient(sun.x, sun.y, sunR * 0.6, sun.x, sun.y, sunR * 7);
  glow.addColorStop(0, rgb(mix([255, 196, 120], [255, 250, 220], w), 0.75));
  glow.addColorStop(0.35, rgb(mix([255, 170, 120], [255, 250, 225], w), 0.28));
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, hz + 2);
  ctx.fillStyle = rgb(mix([255, 150, 64], [255, 244, 190], w));
  ctx.beginPath(); ctx.arc(sun.x, sun.y, sunR, 0, Math.PI * 2); ctx.fill();
  if (!steered && !calm) { // a soft pulse says the sun can be moved, until someone moves it
    const p = (t * 0.45) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${(0.7 * (1 - p)).toFixed(3)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sun.x, sun.y, sunR * (1.15 + p * 0.7), 0, Math.PI * 2); ctx.stroke();
  }

  ctx.fillStyle = rgb(mix([255, 236, 222], [255, 255, 255], w), 0.92);
  for (const c of clouds) {
    c.x += c.v * K; if (c.x > W + 90 * c.s) c.x = -90 * c.s;
    ctx.beginPath();
    for (const p of [[-34, 8, 20], [-10, -6, 28], [20, 0, 24], [44, 9, 17], [6, 11, 26]]) { ctx.moveTo(c.x + (p[0] + p[2]) * c.s, c.y + p[1] * c.s); ctx.arc(c.x + p[0] * c.s, c.y + p[1] * c.s, p[2] * c.s, 0, Math.PI * 2); }
    ctx.fill();
  }

  ctx.strokeStyle = '#12314F'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const b of birds) {
    b.x += 1.6 * K; const flap = Math.sin(t * 7 + b.ph) * 6;
    ctx.beginPath(); ctx.moveTo(b.x - 11, b.y - flap); ctx.quadraticCurveTo(b.x - 5, b.y - 5, b.x, b.y);
    ctx.quadraticCurveTo(b.x + 5, b.y - 5, b.x + 11, b.y - flap); ctx.stroke();
  }

  // Sea: wave bands far to near, with sun glitter, dolphins, boats and splashes slotted between them
  const far = mix(SEA.gold[0], SEA.noon[0], w), near = mix(SEA.gold[1], SEA.noon[1], w);
  ctx.fillStyle = rgb(far); ctx.fillRect(0, hz, W, H - hz);
  const glitter = [];
  for (let i = 0; i < 44; i++) {
    const u = i / 44, tw = 0.55 + 0.45 * Math.sin(t * 2.4 + i * 1.7);
    glitter.push({ y: hz + 4 + Math.pow(u, 1.25) * (H - hz), w: sunR * (0.4 + i * 0.07) * tw, x: sun.x + Math.sin(t * 1.3 + i * 2.1) * sunR * 0.25 * (1 + u * 3), a: 0.6 - u * 0.3, h: 2 + u * 3 });
  }
  const glint = rgb(mix([255, 214, 150], [255, 252, 232], w));
  if (!calm && now > nextLeap) { leapPod(); nextLeap = now + rand(9000, 16000); }
  for (let k = 0; k < LAYERS; k++) {
    const u = k / (LAYERS - 1);
    ctx.beginPath(); ctx.moveTo(-10, H + 10);
    for (let x = -10; x <= W + 10; x += 12) ctx.lineTo(x, waveY(k, x, t));
    ctx.lineTo(W + 10, H + 10); ctx.closePath();
    ctx.fillStyle = rgb(mix(far, near, u)); ctx.fill();
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 12) { const y = waveY(k, x, t); if (x === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1 + u; ctx.stroke();
    const lo = layerBase(k), hi = k < LAYERS - 1 ? layerBase(k + 1) : H + 20;
    ctx.fillStyle = glint;
    for (const g of glitter) {
      if (g.y < lo || g.y >= hi) continue;
      ctx.globalAlpha = g.a; ctx.fillRect(g.x - g.w, g.y, g.w * 2, g.h);
    }
    ctx.globalAlpha = 1;
    dolphins = dolphins.filter((d) => d.k !== k || drawDolphin(d, t, now));
    for (const b of boats) {
      if (b.k !== k) continue;
      b.x += b.v * b.dir * K * (0.5 + u);
      if (b.x > W + 50) b.x = -50; if (b.x < -50) b.x = W + 50;
      drawBoat(b, t, now);
    }
    splashes = splashes.filter((sp) => sp.k !== k || drawSplash(sp, t, now));
  }
  drawMirror(t);
  drawPalm(t);
}

resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeHeadline);
window.addEventListener('load', placeHeadline);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
